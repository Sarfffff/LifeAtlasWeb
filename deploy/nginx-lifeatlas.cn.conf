server {
    listen 80;
    listen [::]:80;
    server_name lifeatlas.cn www.lifeatlas.cn;

    root /www/wwwroot/lifeatlas.cn;
    index index.html;

    access_log /www/wwwlogs/lifeatlas.cn.access.log;
    error_log /www/wwwlogs/lifeatlas.cn.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|mp3|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}

