server {
    server_name lifeatlas.cn www.lifeatlas.cn;

    root /www/wwwroot/lifeatlas.cn;
    index index.html;

    access_log /www/wwwlogs/lifeatlas.cn.access.log;
    error_log /www/wwwlogs/lifeatlas.cn.error.log;

    # 301: legacy dated permalinks (/YYYY/MM/DD/title/...) -> short permalink (/title/...)
    location ~ "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/([^/]+)/(.*)$" {
        return 301 /$1/$2$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|mp3|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lifeatlas.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lifeatlas.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.lifeatlas.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = lifeatlas.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lifeatlas.cn www.lifeatlas.cn;
    return 404; # managed by Certbot
}
